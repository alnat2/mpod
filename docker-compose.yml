services:
  mpod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5050}:5050"
    environment:
      PORT: 5050
      TZ: ${TZ:-UTC}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      DATA_DIR: ${DATA_DIR:-/data}
      DB_PATH: ${DB_PATH:-/data/mpod.sqlite}
      DOWNLOADS_DIR: ${DOWNLOADS_DIR:-/data/downloads}
      DAILY_REFRESH_TIME: ${DAILY_REFRESH_TIME:-03:00}
      SOCKS5_HOST: ${SOCKS5_HOST:-}
      SOCKS5_PORT: ${SOCKS5_PORT:-}
      SOCKS5_USERNAME: ${SOCKS5_USERNAME:-}
      SOCKS5_PASSWORD: ${SOCKS5_PASSWORD:-}
    volumes:
      - mpod_data:/data
    restart: unless-stopped

volumes:
  mpod_data:
